# Ported from meridian@014f706d:.github/workflows/ci.yml; the Playwright step is dropped, and
# zizmor, uv audit and the 20-minute limit are new.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per branch: a newer push to a pull request cancels its older run; runs on main finish.
# (zizmor's pedantic concurrency-limits audit, https://docs.zizmor.sh/audits/#concurrency-limits)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The merge gate requires a check named `check`.
  check:
    name: check
    runs-on: ubuntu-latest
    # A first estimate; to be measured on the first runs.
    timeout-minutes: 20
    env:
      PYRIGHT_PYTHON_IGNORE_WARNINGS: "1" # no version check against PyPI at run time
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # ancestry for the change range
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run zizmor --offline .github/
      # Known vulnerabilities in the locked packages (OSV). An advisory still inside the
      # release cooldown needs a dated `--ignore` here.
      - run: uv audit --locked
      - name: gitleaks (pinned binary, checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Includes the paper-only, public-tree and upstream-gate tests.
      - run: uv run pytest
      - name: gitleaks range scans
        env:
          SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}
          SCAN_BEFORE: ${{ github.event.before }}
        run: bash .github/workflows/gitleaks.sh
